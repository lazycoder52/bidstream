name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bidstream
          POSTGRES_PASSWORD: bidstream_pass
          POSTGRES_DB: bidstream_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bidstream:bidstream_pass@localhost:5432/bidstream_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_IN_MEMORY: 'false'
      THROTTLE_FAIL_OPEN: 'false'
      JWT_ACCESS_SECRET: change_this_to_a_secure_random_string_at_least_32_characters_long
      JWT_REFRESH_SECRET: change_this_to_another_secure_random_string_at_least_32_chars
      PORT: 3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts package
        run: npm run build:contracts

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Verify migrations status & schema sync
        run: |
          npx prisma migrate status --schema=apps/api/prisma/schema.prisma
          npx prisma migrate diff --from-schema-datasource apps/api/prisma/schema.prisma --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code

      - name: Lint check
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm run test

      - name: Run load benchmark smoke & invariant check
        run: |
          node scripts/measure-socket-latency.mjs
          node scripts/check-invariants.mjs

      - name: Verify README metrics consistency
        run: node scripts/verify-readme-metrics.mjs

  docker-compose-check:
    name: Docker Compose Full-Stack Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Start full stack with Docker Compose
        run: docker compose up -d

      - name: Verify API and downstream health
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health || true)
            echo "Attempt $i: API /health HTTP status = $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy and reporting 200 OK!"
              break
            fi
            sleep 2
          done
          if [ "$STATUS" != "200" ]; then
            echo "API failed healthcheck! Dumping docker compose logs:"
            docker compose logs
            exit 1
          fi

      - name: Verify Web frontend is healthy
        run: |
          WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
          echo "Web status = $WEB_STATUS"
          if [ "$WEB_STATUS" != "200" ]; then
            echo "Web container failed to respond! Dumping logs:"
            docker compose logs web
            exit 1
          fi

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v
