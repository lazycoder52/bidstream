name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bidstream
          POSTGRES_PASSWORD: bidstream_pass
          POSTGRES_DB: bidstream_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bidstream:bidstream_pass@localhost:5432/bidstream_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_IN_MEMORY: 'false'
      THROTTLE_FAIL_OPEN: 'false'
      JWT_ACCESS_SECRET: change_this_to_a_secure_random_string_at_least_32_characters_long
      JWT_REFRESH_SECRET: change_this_to_another_secure_random_string_at_least_32_chars
      PORT: 3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source=. --verbose --redact

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm security audit
        run: |
          npm audit --omit=dev --audit-level=critical
          npm audit || true

      - name: Build contracts package
        run: npm run build:contracts

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Verify migrations status & schema sync
        run: |
          npx prisma migrate status --schema=apps/api/prisma/schema.prisma
          npx prisma migrate diff --from-schema-datasource apps/api/prisma/schema.prisma --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code

      - name: Lint check
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm run test

      - name: Verify database invariants after unit & integration tests
        env:
          CI: 'true'
        run: node scripts/check-invariants.mjs

      - name: Verify README metrics consistency
        run: node scripts/verify-readme-metrics.mjs

  docker-compose-check:
    name: Docker Compose Full-Stack Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Start full stack with Docker Compose
        run: |
          if ! docker compose up -d; then
            echo "docker compose up -d failed. Showing logs of all containers:"
            docker compose logs
            exit 1
          fi

      - name: Verify API and downstream health
        run: |
          echo "Waiting for API service to report healthy..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health || true)
            echo "Attempt $i: API /health HTTP status = $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy and reporting 200 OK!"
              break
            fi
            sleep 2
          done
          if [ "$STATUS" != "200" ]; then
            echo "API failed healthcheck! Dumping docker compose logs:"
            docker compose logs
            exit 1
          fi

      - name: Verify Web frontend is healthy
        run: |
          echo "Waiting for Web service to respond..."
          for i in {1..15}; do
            WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            echo "Attempt $i: Web status = $WEB_STATUS"
            if [ "$WEB_STATUS" = "200" ]; then
              echo "Web container is responding with 200 OK!"
              break
            fi
            sleep 2
          done
          if [ "$WEB_STATUS" != "200" ]; then
            echo "Web container failed to respond! Dumping logs:"
            docker compose logs web
            exit 1
          fi

      - name: Setup Node.js 22 LTS for smoke runner
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install k6 binary
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.56.0/k6-v0.56.0-linux-amd64.tar.gz | tar -xz
          sudo mv k6-v0.56.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Seed benchmark auctions and test bidders
        env:
          DATABASE_URL: postgresql://bidstream:bidstream_pass@localhost:5432/bidstream_db?schema=public
          JWT_ACCESS_SECRET: production_access_token_secret_must_be_32_characters
        run: node scripts/seed-benchmark.mjs

      - name: Run 30-second k6 bidding storm smoke against the stack
        env:
          API_URLS: http://localhost:3001
          SMOKE_TEST: 'true'
        run: |
          TOKENS=$(cat scripts/.benchmark-tokens 2>/dev/null || cat scripts/.benchmark-token)
          TOKEN=$(cat scripts/.benchmark-token)
          k6 run -e API_URLS="http://localhost:3001" -e BENCHMARK_TOKENS="$TOKENS" -e BENCHMARK_TOKEN="$TOKEN" -e SMOKE_TEST="true" scripts/k6-bidding-storm.js

      - name: Verify database invariants after load smoke
        env:
          DATABASE_URL: postgresql://bidstream:bidstream_pass@localhost:5432/bidstream_db?schema=public
          CI: 'true'
        run: node scripts/check-invariants.mjs

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v

  e2e:
    name: Playwright E2E Tests (Docker Compose Full Stack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Docker images
        run: docker compose build

      - name: Start full stack with Docker Compose
        run: |
          if ! docker compose up -d; then
            echo "docker compose up -d failed. Showing logs of all containers:"
            docker compose logs
            exit 1
          fi

      - name: Wait for API and Web services to report healthy
        run: |
          echo "Waiting for API and Web services to be healthy..."
          for i in {1..30}; do
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health || true)
            WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            echo "Attempt $i: API = $API_STATUS, Web = $WEB_STATUS"
            if [ "$API_STATUS" = "200" ] && [ "$WEB_STATUS" = "200" ]; then
              echo "Both API and Web are healthy and ready for E2E tests!"
              break
            fi
            sleep 2
          done
          if [ "$API_STATUS" != "200" ] || [ "$WEB_STATUS" != "200" ]; then
            echo "Healthchecks failed! Dumping logs:"
            docker compose logs
            exit 1
          fi

      - name: Run Playwright E2E Tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          CI: 'true'
        run: npx playwright test -c apps/web/playwright.config.ts

      - name: Upload Playwright Trace and Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v
